plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.farcrop'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.farcrop'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.activity:activity-compose:1.6.1'
    implementation platform('androidx.compose:compose-bom:2024.09.0')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.2'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.2'
    implementation 'com.google.code.gson:gson:2.9.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.0'
    implementation 'io.coil-kt:coil-compose:2.16.0'
    implementation 'androidx.activity:activity-ktx:1.6.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
